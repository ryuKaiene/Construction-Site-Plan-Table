<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="工程表">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<title>工事一覧 | 工事工程表</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13h10l1-13"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
  <symbol id="i-gantt" viewBox="0 0 24 24"><path d="M4 6h9M8 12h11M5 18h8"/></symbol>
</svg>

<div class="shell no-tabs">

  <header class="appbar">
    <div class="brand">
      <div class="brand-mark"><svg class="icon"><use href="#i-gantt"/></svg></div>
      <div>
        <div class="brand-name">工事工程表</div>
        <div class="brand-sub">工事案件の一覧</div>
      </div>
    </div>
    <div class="appbar-actions">
      <button type="button" id="btn-new-project" class="btn btn-primary only-wide">
        <svg class="icon icon-sm"><use href="#i-plus"/></svg>新規工事を作成
      </button>
    </div>
  </header>

  <div class="list-wrap">
    <main class="list-main">
      <div class="list-tools" id="list-tools" hidden>
        <input type="search" id="list-search" class="input" placeholder="工事名・発注者・場所で絞り込み" aria-label="工事を絞り込み">
      </div>

      <div id="list-status" class="list-status" hidden></div>

      <div id="project-list" class="project-list"></div>

      <div id="empty-state" class="empty-state" hidden>
        <p class="empty-title" id="empty-title">まだ工事が登録されていません</p>
        <p class="empty-desc" id="empty-desc">最初の工事を登録すると、工程表を作れるようになります。</p>
        <button type="button" id="btn-new-project-empty" class="btn btn-primary">
          <svg class="icon icon-sm"><use href="#i-plus"/></svg>新規工事を作成
        </button>
      </div>
    </main>
  </div>

</div>

<button type="button" id="btn-new-project-fab" class="btn btn-primary fab">
  <svg class="icon"><use href="#i-plus"/></svg>新規工事
</button>

<!-- 新規工事作成フォーム -->
<div id="modal-backdrop" class="backdrop" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="sheet-head">
      <h2 class="sheet-title" id="modal-title">新規工事の登録</h2>
      <button type="button" id="btn-modal-close" class="icon-btn" aria-label="閉じる"><svg class="icon"><use href="#i-close"/></svg></button>
    </div>

    <form id="new-project-form" class="sheet-body">
      <div class="form-grid cols-2">
        <label class="field span-2">
          <span class="field-label">工事名 <em class="req">必須</em></span>
          <input type="text" name="projectName" class="input" required
                 placeholder="例：６災１１２２号　二級河川松波川　河川災害復旧工事（その１）">
        </label>

        <label class="field">
          <span class="field-label">工期（開始） <em class="req">必須</em></span>
          <input type="date" name="startDate" class="input" required>
        </label>

        <label class="field">
          <span class="field-label">工期（終了） <em class="req">必須</em></span>
          <input type="date" name="endDate" class="input" required>
        </label>

        <label class="field">
          <span class="field-label">発注者</span>
          <input type="text" name="orderer" class="input" placeholder="例：石川県土木部">
        </label>

        <label class="field">
          <span class="field-label">施工者</span>
          <input type="text" name="contractor" class="input" placeholder="例：株式会社 西中建設">
        </label>

        <label class="field span-2">
          <span class="field-label">工事場所</span>
          <input type="text" name="location" class="input" placeholder="例：鳳珠郡能登町字松波地内">
        </label>

        <label class="field span-2">
          <span class="field-label">設計・監理</span>
          <input type="text" name="supervisor" class="input">
        </label>

        <label class="field">
          <span class="field-label">契約年月日</span>
          <input type="date" name="contractDate" class="input">
        </label>

        <label class="field">
          <span class="field-label">作成日</span>
          <input type="date" name="createdDate" class="input">
        </label>
      </div>

      <div class="form-error" id="form-error" hidden></div>

      <div class="sheet-actions">
        <button type="button" id="btn-modal-cancel" class="btn">キャンセル</button>
        <button type="submit" id="btn-modal-submit" class="btn btn-primary">この内容で作成する</button>
      </div>
    </form>
  </div>
</div>

<script src="projects.js"></script>
</body>
</html>
