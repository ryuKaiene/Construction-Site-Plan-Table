<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工事一覧 | 工事工程表</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <header class="toolbar">
    <div class="toolbar-left">
      <div class="toolbar-title">工事工程表</div>
      <span class="toolbar-sub">工事案件一覧</span>
    </div>
    <div class="toolbar-group">
      <button id="btn-new-project" class="btn btn-accent">＋ 新規工事を作成</button>
    </div>
  </header>

  <main class="list-main">
    <div id="list-status" class="list-status"></div>

    <div id="project-list" class="project-list"></div>

    <div id="empty-state" class="empty-state" hidden>
      <p class="empty-title">まだ工事が登録されていません</p>
      <p class="empty-desc">「＋ 新規工事を作成」から、最初の工事を登録してください。</p>
    </div>
  </main>

</div>

<!-- 新規工事作成フォーム -->
<div id="modal-backdrop" class="modal-backdrop" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-head">
      <h2 class="modal-title" id="modal-title">新規工事の登録</h2>
      <button id="btn-modal-close" class="modal-close" title="閉じる">✕</button>
    </div>

    <form id="new-project-form" class="modal-body">
      <label class="form-field form-wide">
        <span class="form-label">工事名 <em class="req">必須</em></span>
        <input type="text" name="projectName" class="form-input" required
               placeholder="例：６災１１２２号　二級河川松波川　河川災害復旧工事（その１）">
      </label>

      <label class="form-field">
        <span class="form-label">発注者</span>
        <input type="text" name="orderer" class="form-input" placeholder="例：石川県土木部">
      </label>

      <label class="form-field">
        <span class="form-label">施工者</span>
        <input type="text" name="contractor" class="form-input" placeholder="例：株式会社 西中建設">
      </label>

      <label class="form-field form-wide">
        <span class="form-label">工事場所</span>
        <input type="text" name="location" class="form-input" placeholder="例：鳳珠郡能登町字松波地内">
      </label>

      <label class="form-field">
        <span class="form-label">設計・監理</span>
        <input type="text" name="supervisor" class="form-input">
      </label>

      <label class="form-field">
        <span class="form-label">契約年月日</span>
        <input type="date" name="contractDate" class="form-input">
      </label>

      <label class="form-field">
        <span class="form-label">工期（開始） <em class="req">必須</em></span>
        <input type="date" name="startDate" class="form-input" required>
      </label>

      <label class="form-field">
        <span class="form-label">工期（終了） <em class="req">必須</em></span>
        <input type="date" name="endDate" class="form-input" required>
      </label>

      <label class="form-field">
        <span class="form-label">作成日</span>
        <input type="date" name="createdDate" class="form-input">
      </label>

      <div class="form-error" id="form-error" hidden></div>

      <div class="modal-actions">
        <button type="button" id="btn-modal-cancel" class="btn">キャンセル</button>
        <button type="submit" id="btn-modal-submit" class="btn btn-accent">この内容で作成する</button>
      </div>
    </form>
  </div>
</div>

<script src="projects.js"></script>
</body>
</html>
