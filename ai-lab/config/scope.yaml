# 対象領域と優先度。変更は利用者の指示があったときだけ行う。
# weight は採点時の掛け率（0〜1）。enabled: false の領域は提案しない。
domains:
  業務効率化:
    weight: 1.0
    enabled: true
    focus:
      - 建設業における業務の自動化
      - 書類作成・整理・管理
      - 現場管理・施工管理
      - 社内情報共有
      - メール・LINEなど業務連絡
      - AIを活用した業務システム
      - 無駄・非効率の発見
  新規事業:
    weight: 0.3
    enabled: true
  家族・家庭:
    weight: 0.0
    enabled: false
  技術研究:
    weight: 0.0
    enabled: false
  自己成長:
    weight: 0.0
    enabled: false
  趣味・生活:
    weight: 0.0
    enabled: false

# 週の作業配分の目安（育成・新規・探索）
allocation:
  grow: 0.7
  new: 0.2
  explore: 0.1

limits:
  candidates_per_week: 10   # 提示する候補数
  detailed_candidates: 3    # 7項目を詳述する件数
  explore_slots: 2          # 根拠のない発想（探索）の上限
  trial_products_max: 3     # 同時に試用段階に置ける成果物数
  no_feedback_days: 14      # 評価がこの日数ないとき、利用状況を確認する
